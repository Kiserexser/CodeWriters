<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModCodX Messenger</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded, query, limitToLast, orderByChild, set, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLHOrkSTiON5GwVBg4uSWZxAZ1ChRlQQI",
            authDomain: "massage-9d9e0.firebaseapp.com",
            databaseURL: "https://massage-9d9e0-default-rtdb.firebaseio.com",
            projectId: "massage-9d9e0",
            storageBucket: "massage-9d9e0.firebasestorage.app",
            messagingSenderId: "863054107330",
            appId: "1:863054107330:web:8a588ba2e42e5c82ff615b",
            measurementId: "G-9QQC0RPCCG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        setPersistence(auth, browserLocalPersistence);

        // DOM элементы
        const loginDiv = document.getElementById('loginDiv');
        const chatDiv = document.getElementById('chatDiv');
        const settingsDiv = document.getElementById('settingsDiv');
        const accountsDiv = document.getElementById('accountsDiv');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const messageInput = document.getElementById('messageInput');
        const messagesDiv = document.getElementById('messages');
        const currentUserSpan = document.getElementById('currentUser');
        const searchInput = document.getElementById('searchInput');
        const friendsList = document.getElementById('friendsList');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatFriendName = document.getElementById('chatFriendName');
        const sendBtn = document.getElementById('sendBtn');
        const mainMenu = document.getElementById('mainMenu');
        const accountsListDiv = document.getElementById('accountsList');
        const settingsTheme = document.getElementById('settingsTheme');
        const settingsNotifications = document.getElementById('settingsNotifications');
        const settingsSound = document.getElementById('settingsSound');

        let currentUserEmail = null;
        let currentUsername = null;
        let currentFriend = null;
        let allUsers = {};
        let savedAccounts = JSON.parse(localStorage.getItem('modcodx_accounts') || '[]');

        // Сохранение аккаунта
        function saveAccount(email, password, username) {
            if (!savedAccounts.find(a => a.email === email)) {
                savedAccounts.push({ email, password, username });
                if (savedAccounts.length > 3) savedAccounts.shift();
                localStorage.setItem('modcodx_accounts', JSON.stringify(savedAccounts));
                updateAccountsList();
            }
        }

        function updateAccountsList() {
            accountsListDiv.innerHTML = '';
            savedAccounts.forEach(acc => {
                const btn = document.createElement('button');
                btn.textContent = `${acc.username} (${acc.email})`;
                btn.onclick = () => switchAccount(acc.email, acc.password);
                accountsListDiv.appendChild(btn);
            });
        }

        async function switchAccount(email, password) {
            await signOut(auth);
            await signInWithEmailAndPassword(auth, email, password);
        }

        window.register = () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            const username = usernameInput.value;
            if (!username) { alert("Введите никнейм"); return; }
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const userRef = ref(db, `users/${userCredential.user.uid}`);
                    set(userRef, { email, username });
                    saveAccount(email, password, username);
                    alert("Регистрация успешна!");
                })
                .catch((error) => alert("Ошибка: " + error.message));
        };

        window.login = () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => alert("Ошибка входа: " + error.message));
        };

        window.logout = () => signOut(auth);

        window.sendMessage = () => {
            if (!currentFriend) { alert("Выберите друга"); return; }
            const text = messageInput.value.trim();
            if (!text) return;
            const chatId = [currentUserEmail, currentFriend.email].sort().join('_');
            push(ref(db, `messages/${chatId}`), {
                sender: currentUserEmail,
                senderName: currentUsername,
                text,
                timestamp: Date.now()
            });
            messageInput.value = '';
        };

        window.selectFriend = (email, username) => {
            currentFriend = { email, username };
            chatFriendName.innerHTML = `💬 Чат с ${username}`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messagesDiv.innerHTML = '';
            const chatId = [currentUserEmail, email].sort().join('_');
            const messagesRef = query(ref(db, `messages/${chatId}`), orderByChild('timestamp'), limitToLast(50));
            onChildAdded(messagesRef, (data) => displayMessage(data.val()));
        };

        window.searchFriends = () => updateFriendListDisplay();
        window.showSettings = () => { settingsDiv.style.display = 'block'; chatDiv.style.display = 'none'; loginDiv.style.display = 'none'; accountsDiv.style.display = 'none'; };
        window.showAccounts = () => { accountsDiv.style.display = 'block'; settingsDiv.style.display = 'none'; chatDiv.style.display = 'none'; loginDiv.style.display = 'none'; };
        window.showChat = () => { chatDiv.style.display = 'block'; settingsDiv.style.display = 'none'; accountsDiv.style.display = 'none'; loginDiv.style.display = 'none'; };
        window.closeSettings = () => showChat();
        window.closeAccounts = () => showChat();

        window.applySettings = () => {
            const theme = settingsTheme.value;
            const notifications = settingsNotifications.checked;
            const sound = settingsSound.checked;
            localStorage.setItem('modcodx_theme', theme);
            localStorage.setItem('modcodx_notifications', notifications);
            localStorage.setItem('modcodx_sound', sound);
            document.body.style.background = theme === 'dark' ? '#0a0a0a' : '#e0e0e0';
            alert('Настройки сохранены');
        };

        function displayMessage(msg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = msg.sender === currentUserEmail ? 'message-sent' : 'message-received';
            msgDiv.innerHTML = `<div class="message-sender">${msg.senderName}</div><div class="message-text">${msg.text}</div><div class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            if (localStorage.getItem('modcodx_sound') === 'true') new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3').play();
        }

        function updateFriendListDisplay() {
            const searchTerm = searchInput.value.toLowerCase();
            friendsList.innerHTML = '';
            let hasFriends = false;
            for (const [email, username] of Object.entries(allUsers)) {
                if (email !== currentUserEmail && username.toLowerCase().includes(searchTerm)) {
                    hasFriends = true;
                    const div = document.createElement('div');
                    div.className = 'friend-item';
                    div.innerHTML = `<span>${username}</span><button onclick="selectFriend('${email}', '${username}')">💬</button>`;
                    friendsList.appendChild(div);
                }
            }
            if (!hasFriends) friendsList.innerHTML = '<div style="color:#555;text-align:center;padding:20px;">👥 Нет друзей</div>';
        }

        function loadAllUsers() {
            onChildAdded(ref(db, 'users'), (data) => {
                const user = data.val();
                if (user.email !== currentUserEmail) allUsers[user.email] = user.username;
                updateFriendListDisplay();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                const snapshot = await get(ref(db, `users/${user.uid}`));
                currentUsername = snapshot.exists() ? snapshot.val().username : user.email;
                currentUserSpan.innerText = currentUsername;
                loginDiv.style.display = 'none';
                showChat();
                logoutBtn.style.display = 'block';
                loadAllUsers();
                updateFriendListDisplay();
            } else {
                loginDiv.style.display = 'block';
                chatDiv.style.display = 'none';
                settingsDiv.style.display = 'none';
                accountsDiv.style.display = 'none';
                logoutBtn.style.display = 'none';
                currentFriend = null;
                allUsers = {};
                messagesDiv.innerHTML = '';
                chatFriendName.innerHTML = '💬 Выберите друга';
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }
        });

        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        updateAccountsList();

        // Загрузка настроек
        const savedTheme = localStorage.getItem('modcodx_theme');
        if (savedTheme) document.body.style.background = savedTheme === 'dark' ? '#0a0a0a' : '#e0e0e0';
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Segoe UI', 'Consolas', monospace; padding: 20px; min-height: 100vh; transition: background 0.3s; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { background: #141414; padding: 16px 20px; border-bottom: 1px solid #2a2a2a; border-radius: 16px 16px 0 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 24px; font-weight: 700; color: #fff; cursor: pointer; }
        .logo span { color: #4ec9b0; }
        .menu-buttons { display: flex; gap: 10px; }
        .menu-btn { background: #1e1e1e; border: 1px solid #3a3a3a; color: #ddd; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .menu-btn:hover { background: #2a2a2a; border-color: #4ec9b0; }
        .main-content { display: flex; background: #0d0d0d; border-radius: 0 0 16px 16px; overflow: hidden; min-height: 600px; }
        .friends-panel { width: 280px; background: #0a0a0a; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; }
        .friends-header { padding: 16px; border-bottom: 1px solid #2a2a2a; }
        .friends-header input { width: 100%; background: #1a1a1a; border: 1px solid #3a3a3a; padding: 8px 12px; border-radius: 8px; color: #fff; }
        .friends-list { flex: 1; overflow-y: auto; padding: 8px; }
        .friend-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; margin: 4px 0; background: #141414; border-radius: 8px; }
        .friend-item span { color: #ddd; font-size: 13px; }
        .friend-item button { background: #1e1e1e; border: 1px solid #3a3a3a; color: #4ec9b0; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
        .chat-panel { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 16px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a; }
        .chat-header h3 { color: #4ec9b0; font-size: 16px; }
        .messages-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message-sent { align-self: flex-end; background: #1a4a1a; border-radius: 12px 12px 4px 12px; padding: 8px 12px; max-width: 70%; }
        .message-received { align-self: flex-start; background: #2a2a2a; border-radius: 12px 12px 12px 4px; padding: 8px 12px; max-width: 70%; }
        .message-sender { font-size: 10px; color: #4ec9b0; margin-bottom: 4px; }
        .message-text { font-size: 13px; color: #fff; word-break: break-word; }
        .message-time { font-size: 9px; color: #888; margin-top: 4px; text-align: right; }
        .input-area { padding: 16px; border-top: 1px solid #2a2a2a; display: flex; gap: 12px; }
        .input-area input { flex: 1; background: #1a1a1a; border: 1px solid #3a3a3a; padding: 10px 14px; border-radius: 24px; color: #fff; }
        .input-area button { background: #1e1e1e; border: 1px solid #4ec9b0; color: #4ec9b0; padding: 8px 20px; border-radius: 24px; cursor: pointer; font-weight: 600; }
        .login-container, .settings-container, .accounts-container { background: #0d0d0d; border-radius: 16px; padding: 40px; max-width: 500px; margin: 0 auto; text-align: center; }
        .login-container input, .settings-container select, .settings-container input { width: 100%; background: #1a1a1a; border: 1px solid #3a3a3a; padding: 12px; margin: 8px 0; border-radius: 8px; color: #fff; }
        .login-container button, .settings-container button, .accounts-container button { width: 100%; background: #1e1e1e; border: 1px solid #4ec9b0; color: #4ec9b0; padding: 10px; margin-top: 12px; border-radius: 8px; cursor: pointer; }
        .btn-logout { background: #1e1e1e; border: 1px solid #ff5555; color: #ff5555; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
        .current-user { color: #4ec9b0; font-size: 12px; }
        h2 { color: #4ec9b0; margin-bottom: 24px; }
        .setting-item { text-align: left; margin: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .setting-item label { color: #ddd; }
        .accounts-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .accounts-list button { background: #1a1a1a; border: 1px solid #4ec9b0; color: #4ec9b0; padding: 12px; text-align: left; }
        .back-btn { background: #1e1e1e; border: 1px solid #666; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo" onclick="showChat()">Mod<span>Cod</span>X Messenger</div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="menu-buttons">
                    <button class="menu-btn" onclick="showAccounts()">👥 Аккаунты</button>
                    <button class="menu-btn" onclick="showSettings()">⚙️ Настройки</button>
                </div>
                <span class="current-user" id="currentUser"></span>
                <button class="btn-logout" id="logoutBtn" onclick="logout()">🚪 Выход</button>
            </div>
        </div>

        <div id="loginDiv" class="login-container">
            <h2>🔐 Вход / Регистрация</h2>
            <input type="text" id="username" placeholder="Никнейм">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="register()">📝 Зарегистрироваться</button>
            <button onclick="login()">🔓 Войти</button>
        </div>

        <div id="chatDiv" style="display: none;">
            <div class="main-content">
                <div class="friends-panel">
                    <div class="friends-header">
                        <input type="text" id="searchInput" placeholder="🔍 Поиск друзей..." onkeyup="searchFriends()">
                    </div>
                    <div class="friends-list" id="friendsList"><div style="color:#555;text-align:center;padding:20px;">Загрузка...</div></div>
                </div>
                <div class="chat-panel">
                    <div class="chat-header"><h3 id="chatFriendName">💬 Выберите друга</h3></div>
                    <div class="messages-area" id="messages"><div style="color:#555;text-align:center;padding:20px;">Выберите друга</div></div>
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
                        <button id="sendBtn" onclick="sendMessage()" disabled>📤 Отправить</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="settingsDiv" style="display: none;" class="settings-container">
            <h2>⚙️ Настройки</h2>
            <div class="setting-item"><label>Тема:</label><select id="settingsTheme"><option value="dark">🌙 Тёмная</option><option value="light">☀️ Светлая</option></select></div>
            <div class="setting-item"><label>Уведомления:</label><input type="checkbox" id="settingsNotifications" checked></div>
            <div class="setting-item"><label>Звук сообщений:</label><input type="checkbox" id="settingsSound" checked></div>
            <button onclick="applySettings()">💾 Сохранить</button>
            <button class="back-btn" onclick="closeSettings()">← Назад</button>
        </div>

        <div id="accountsDiv" style="display: none;" class="accounts-container">
            <h2>👥 Мои аккаунты (max 3)</h2>
            <div id="accountsList" class="accounts-list"></div>
            <button class="back-btn" onclick="closeAccounts()">← Назад</button>
        </div>
    </div>
</body>
</html>
